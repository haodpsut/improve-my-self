<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Improve my self · học khái niệm, trắc nghiệm, luyện nói</title>
  <meta name="description" content="Trang tĩnh tự học thuật ngữ kỹ thuật Anh, Việt, Nga. Thẻ ghi nhớ, trắc nghiệm và luyện nói, dữ liệu nằm hoàn toàn trong JSON.">
  <meta name="theme-color" content="#eef5ea">
  <!-- Dau ban ma nguon, in o chan trang. Du lieu va ma nguon doi doc lap nhau,
       nen chi mot dau ngay du lieu thi khong phan biet duoc "chua cap nhat" voi
       "trinh duyet con giu ban cu". Cong QA bat gia tri nay phai bang VERSION
       trong sw.js, de hai noi khong bao gio noi hai dieu khac nhau. -->
  <meta name="build" content="v3">
  <!-- iOS khong doc site.webmanifest de mo toan man hinh, van phai dung ba the
       rieng nay. Thieu chung thi bam Them vao man hinh chinh se ra mot loi tat
       mo trong Safari kem thanh dia chi, khong phai mot ung dung. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Improve">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese,latin">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/">
      <img class="brand-mark" src="assets/logo.svg" width="40" height="40" alt="">
      <span class="brand-text">
        <strong>Improve my self</strong>
        <small>khái niệm · trắc nghiệm · luyện nói</small>
      </span>
    </a>
    <nav class="topnav">
      <a href="#/" data-nav="home">Trang chính</a>
      <a href="#/plan" data-nav="today">Hôm nay</a>
      <a href="#/browse" data-nav="browse">Tra cứu</a>
      <a href="#/stats" data-nav="stats">Tiến độ</a>
    </nav>
    <button class="icon-btn" id="theme-toggle" type="button" title="Đổi nền sáng tối" aria-label="Đổi nền sáng tối">◐</button>
  </header>

  <main id="app" class="app" aria-live="polite">
    <div class="loading">Đang tải dữ liệu…</div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="footer">
    <span>Dữ liệu nằm trong <code>data/</code>. Sửa JSON là trang tự đổi theo, không có bước build.</span>
    <span id="ver" class="ver"></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
