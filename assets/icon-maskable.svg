<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Improve my self">
  <!-- Ban danh cho khuon cat cua Android. Nen phu KIN toan bo o vuong, con hinh
       ve thi nam gon trong vong tron duong kinh 80 phan tram o giua, vi khuon cat
       cua tung hang may moi hang mot kieu: tron, vuong bo goc, hay hinh giot nuoc. -->
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5db63a"/>
      <stop offset="0.55" stop-color="#3f8f26"/>
      <stop offset="1" stop-color="#2b8a4a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#mbg)"/>

  <!-- The phia sau, goi y mot chong the dang cho lat -->
  <rect x="150" y="186" width="150" height="134" rx="27" fill="#ffffff" opacity="0.42"
        transform="rotate(-13 225 253)"/>

  <!-- The mat truoc, nam gon trong vong an toan -->
  <rect x="188" y="152" width="160" height="182" rx="32" fill="#ffffff"/>

  <!-- Mui nhon di len -->
  <path d="M226 270 L268 218 L310 270" fill="none" stroke="#1f6b3d" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
