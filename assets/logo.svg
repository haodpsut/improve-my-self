<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Improve my self">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.55" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#b98bff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="32" rx="16" fill="url(#sheen)"/>

  <!-- The phia sau, goi y mot chong the dang cho lat -->
  <rect x="13" y="21" width="28" height="25" rx="5" fill="#ffffff" opacity="0.42"
        transform="rotate(-13 27 33)"/>

  <!-- The mat truoc -->
  <rect x="20" y="15" width="30" height="34" rx="6" fill="#ffffff"/>

  <!-- Mui nhon di len, y la hoc de tien len chu khong phai de luu tru -->
  <path d="M27 37 L35 27 L43 37" fill="none" stroke="#5b6ee8" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
